name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # O squash usa o título do PR como mensagem do commit, então é ele que
      # precisa seguir o padrão (ex.: "feat: rastreio público").
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-záéíóúâêôãõç0-9].*$
          subjectPatternError: |
            O assunto "{subject}" deve começar com letra minúscula, ex.: "feat: rastreio público".
