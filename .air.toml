root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/api ./cmd/api"
  entrypoint = ["/tmp/air/api"]
  include_ext = ["go", "sql", "yaml"]
  exclude_dir = ["bin", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
