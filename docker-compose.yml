services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rastreia
      POSTGRES_PASSWORD: rastreia
      POSTGRES_DB: rastreia
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastreia"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://rastreia:rastreia@db:5432/rastreia?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-at-least-32-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rastreia.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
