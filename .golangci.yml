version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - internal/store
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Victor-Novakoski/rastreia
