# Ambiente de desenvolvimento: a API roda com air e recompila a cada alteração.
# O docker compose carrega este arquivo sozinho junto com o docker-compose.yml.
# Para subir a imagem de produção, sem air: docker compose -f docker-compose.yml up --build
services:
  api:
    build:
      context: .
      target: dev
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

volumes:
  go-mod:
  go-build:
