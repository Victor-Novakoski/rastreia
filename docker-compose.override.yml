# Carregado automaticamente pelo docker compose: a API roda com air e
# recompila a cada alteração. A imagem de produção é o estágio final do Dockerfile.
services:
  api:
    image: rastreia-api-dev
    build:
      context: .
      target: dev
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

volumes:
  go-mod:
  go-build:
