openapi: 3.0.3
info:
  title: Rastreia API
  version: 0.1.0
  description: Delivery tracking API. Admins create deliveries and drivers; drivers update status; customers follow a public tracking link.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    ValidationError:
      type: object
      properties:
        error: { type: string, example: invalid input }
        fields:
          type: object
          additionalProperties: { type: string }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, driver] }
        created_at: { type: string, format: date-time }
    CreateDriver:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, description: At most 72 bytes; common passwords are refused }
    Delivery:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tracking_code: { type: string, example: RS7K2M9QXA4P }
        recipient_name: { type: string }
        recipient_email: { type: string, format: email }
        address: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        driver_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the delivery last became delivered or failed
    Status:
      type: string
      enum: [pending, picked_up, in_transit, delivered, failed]
    CreateDelivery:
      type: object
      required: [recipient_name, recipient_email, address]
      properties:
        recipient_name: { type: string }
        recipient_email: { type: string, format: email }
        address: { type: string }
        driver_id: { type: integer, format: int64 }
    Event:
      type: object
      properties:
        id: { type: integer, format: int64 }
        delivery_id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/Status" }
        note: { type: string, nullable: true }
        created_by: { type: integer, format: int64, nullable: true, description: null for events written by the system }
        created_at: { type: string, format: date-time }
    CreateEvent:
      type: object
      required: [status]
      description: |
        Allowed transitions: pending → picked_up | failed; picked_up → in_transit | failed;
        in_transit → delivered | failed; failed → in_transit. delivered is final.
      properties:
        status: { $ref: "#/components/schemas/Status" }
        note: { type: string, maxLength: 500, description: Required when status is failed }
    Tracking:
      type: object
      description: Public view of a delivery. No e-mail, address, last name, driver or notes.
      properties:
        tracking_code: { type: string, example: RS7K2M9QXA4P }
        status: { $ref: "#/components/schemas/Status" }
        recipient_first_name: { type: string, example: Maria }
        updated_at: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/Status" }
              created_at: { type: string, format: date-time }
    UpdateDelivery:
      type: object
      description: Only the fields sent are changed. Status changes through delivery events.
      properties:
        recipient_name: { type: string }
        recipient_email: { type: string, format: email }
        address: { type: string }
        driver_id: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: Malformed request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Role not allowed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Too many requests or failed logins; wait for Retry-After seconds
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: Validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ValidationError" } } }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
paths:
  /health:
    get:
      summary: Health check (also pings the database)
      responses:
        "200": { description: OK }
        "503": { description: Database unavailable }
  /auth/login:
    post:
      summary: Log in and get a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [admin, driver] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /drivers:
    get:
      summary: List drivers
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Drivers
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a driver
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDriver" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: E-mail already in use }
        "422": { $ref: "#/components/responses/Invalid" }
  /deliveries:
    get:
      summary: List deliveries, newest first
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Deliveries
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Delivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      summary: Create a delivery (a tracking code and a first "pending" event are generated)
      security: [{ bearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          description: |
            Optional, 1 to 255 visible ASCII characters. Retrying with the same key within 24 hours
            returns the delivery created the first time, with Idempotent-Replayed: true, instead of
            creating another. The same key with a different body is rejected with 422.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDelivery" } } }
      responses:
        "201":
          description: Created (or replayed, with an Idempotency-Key already used)
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /deliveries/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Get a delivery
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Delivery
          content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit a delivery
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateDelivery" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /deliveries/{id}/events:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Status history of a delivery, oldest first
      description: Admins see every delivery; drivers only those assigned to them (404 for any other).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Events
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Change the status of a delivery
      description: Admins may change any delivery; drivers only those assigned to them (404 for any other).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateEvent" } } }
      responses:
        "201":
          description: Status changed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Transition not allowed, or the status changed meanwhile }
        "422": { $ref: "#/components/responses/Invalid" }
  /me/deliveries:
    get:
      summary: Deliveries assigned to the driver making the request, newest first
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Deliveries
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Delivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /public/tracking/{code}:
    get:
      summary: Public tracking page data (no login)
      description: |
        Unknown, malformed and expired codes answer 404. The link expires 30 days after the delivery
        is delivered or last failed. Limited to 30 requests per minute per IP.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: RS7K2M9QXA4P } }
      responses:
        "200":
          description: Tracking
          content: { application/json: { schema: { $ref: "#/components/schemas/Tracking" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
